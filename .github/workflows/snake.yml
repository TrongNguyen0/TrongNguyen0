# Redraws the contribution snake once a day into the `output` branch; the README links the SVGs from there.
# Dots use the same navy/blue scale as the rest of the profile instead of GitHub's green.
name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0F172A&color_dots=#EBEDF0,#BFDBFE,#60A5FA,#2563EB,#1E3A8A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E2E8F0&color_dots=#161B22,#1E3A8A,#1D4ED8,#3B82F6,#93C5FD
      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
